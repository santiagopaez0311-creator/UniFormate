<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Iniciar sesión - UniFormate</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="roles.css"></head>
<body data-page="login"><div class="login-wrap"><div class="login-box">
<h1>UniFormate</h1><p>Inicia sesión para continuar.</p>
<form id="login-form" novalidate>
<div class="form-group"><label for="l-email">Correo electrónico</label><input id="l-email" type="email" autocomplete="username"></div>
<div class="form-group"><label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password"></div>
<p class="error-message" id="l-err" role="alert"></p>
<button class="btn btn-primary btn-block">Entrar</button></form>
<div class="demo" id="demo">Cuentas de prueba (clic para rellenar):<br>
<button class="btn btn-sm btn-light" data-e="aprendiz@misena.edu.co" data-p="aprendiz123">Aprendiz</button>
<button class="btn btn-sm btn-light" data-e="empresa@uniformate.co" data-p="empresa123">Empresa</button>
<button class="btn btn-sm btn-light" data-e="admin@uniformate.co" data-p="admin123">Administrador</button>
<button class="btn btn-sm btn-light" data-e="sistema@uniformate.co" data-p="sistema123">Sistema</button></div>
</div></div><script src="app.js"></script></body></html>
