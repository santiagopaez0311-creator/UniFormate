<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ingresar - UniFormate</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('uf_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css"></head>
<body data-page="login"><button id="theme" class="icon-btn" type="button" aria-label="Cambiar tema claro u oscuro" style="position:fixed;top:12px;right:12px;color:#fff;z-index:5"><i class="fa-solid fa-moon"></i></button>
<div class="login-wrap"><div class="bg-anim" aria-hidden="true"><i class="fa-solid fa-shirt" style="--x:5%;--s:38px;--d:16s;--l:-0s"></i><i class="fa-solid fa-scissors" style="--x:18%;--s:26px;--d:13s;--l:-3s"></i><i class="fa-solid fa-tags" style="--x:30%;--s:34px;--d:18s;--l:-6s"></i><i class="fa-solid fa-star" style="--x:42%;--s:22px;--d:12s;--l:-1s"></i><i class="fa-solid fa-shield-halved" style="--x:55%;--s:40px;--d:17s;--l:-4s"></i><i class="fa-solid fa-layer-group" style="--x:67%;--s:28px;--d:14s;--l:-7s"></i><i class="fa-solid fa-shirt" style="--x:78%;--s:24px;--d:12s;--l:-2s"></i><i class="fa-solid fa-user-graduate" style="--x:90%;--s:36px;--d:15s;--l:-5s"></i></div><div class="login-box">
<div class="logo-icon login-logo"><img src="img/logo-uniformate-web.png" alt="Logo UniFormate"></div>
<h1>UniFormate</h1><p>Elige tu rol para ingresar.</p>
<form id="login-form" novalidate>
<div class="form-group"><label for="l-rol">Rol</label><select id="l-rol"><option value="aprendiz">Aprendiz</option><option value="empresa">Empresa</option><option value="administrador">Administrador</option><option value="sistema">Sistema</option></select></div>
<div class="form-group"><label for="l-nombre">Nombre</label><input id="l-nombre" autocomplete="name" placeholder="Tu nombre"></div>
<div class="form-group" id="g-emp" hidden><label for="l-emp">Tu empresa</label><select id="l-emp"></select></div>
<div class="form-group" id="g-mail"><label for="l-mail">Correo institucional (opcional)</label><input id="l-mail" type="email" placeholder="usuario@misena.edu.co"></div>
<p class="error-message" id="l-err" role="alert"></p>
<button class="btn btn-primary btn-block">Ingresar</button></form>
</div></div><script src="js/main.js"></script></body></html>
